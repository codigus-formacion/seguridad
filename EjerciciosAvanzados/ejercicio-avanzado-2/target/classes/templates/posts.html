<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Posts List - Post Board</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
{{> header}}
    <div class="container">
        <h1>Posts</h1>
        <a href="/posts/new" class="btn">Create New Post</a>
    
    <ul class="post-list">
        {{#posts}}
        <li class="post-item">
            <h3><a href="/posts/{{id}}">{{title}}</a></h3>
            <p><strong>By:</strong> {{username}}</p>
            <p>{{text}}</p>
        </li>
        {{/posts}}
        {{^posts}}
        <p>No posts available.</p>
        {{/posts}}
    </ul>
    </div>
{{> footer}}
